environment: development
health:
  duration: 1s
  timeout: 1s
id:
  kind: uuid
telemetry:
  logger:
    kind: text
    level: info
  metrics:
    kind: otlp
    url: http://lgtm:4318/v1/metrics
    interval: 5s
  tracer:
    kind: otlp
    url: http://lgtm:4318/v1/traces
transport:
  http:
    limiter:
      kind: user-agent
      tokens: 1000
      interval: 1s
    timeout: 5s
